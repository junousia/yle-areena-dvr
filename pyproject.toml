[project]
name = "yle-areena-dvr"
version = "0.1.1"
description = "A tool for Yle Areena to download movies and series of interest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jukka Nousiainen" }]
keywords = ["yle", "areena", "dvr", "yt-dlp", "tmdb", "agent-skill"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "yt-dlp",
    "httpx",
    "aiosqlite",
    "sqlmodel",
    "pydantic",
    "pydantic-settings",
    "pydantic-cli",
    "pyyaml",
    "greenlet",
]

[project.urls]
Homepage = "https://github.com/junousia/yle-areena-dvr"
Issues = "https://github.com/junousia/yle-areena-dvr/issues"

[project.scripts]
yle-areena-dvr = "yle_areena_dvr.cli:main"  # matches the package name, so `uvx yle-areena-dvr` works
yle-dvr = "yle_areena_dvr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"assets/config.yaml" = "yle_areena_dvr/default_config.yaml"
